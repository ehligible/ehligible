name: Android

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Format, lint, test, build debug APK
        run: ./gradlew --console=plain check :androidApp:assembleDebug

      # Release builds run R8, which can break code that debug builds never exercise. Unsigned here.
      - name: Build release (v1.0, no background location)
        run: ./gradlew --console=plain :androidApp:assembleRelease

      - name: Build release (v1.1, with background location)
        run: ./gradlew --console=plain :androidApp:assembleRelease -Pehligible.backgroundLocation=true

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ehligible-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
