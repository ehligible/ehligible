name: iOS

# No Mac in the loop: this is where the iOS app is built, tested and launched (on a simulator).
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: io.github.ehligible.app

jobs:
  simulator:
    name: Build, test and launch on a simulator
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Show the toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec iosApp/project.yml

      - name: Pick an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, items in sorted(devices.items(), reverse=True) if "iOS" in runtime
                     for d in items if d["name"].startswith("iPhone")))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$udid" -b

      - name: Kotlin tests on the simulator
        run: >-
          ./gradlew --console=plain :core:iosSimulatorArm64Test :composeApp:iosSimulatorArm64Test
          -Pehligible.simulator=${{ steps.simulator.outputs.udid }}

      - name: Widget tests (and images of every widget size)
        env:
          TEST_RUNNER_WIDGET_SNAPSHOT_DIR: ${{ github.workspace }}/build/ios/screenshots/widget
        run: >-
          xcodebuild test -project iosApp/Ehligible.xcodeproj -scheme EhligibleWidgetTests
          -destination "id=${{ steps.simulator.outputs.udid }}" CODE_SIGNING_ALLOWED=NO

      - name: Build the app
        run: >-
          xcodebuild build -project iosApp/Ehligible.xcodeproj -scheme Ehligible -configuration Debug
          -destination "id=${{ steps.simulator.outputs.udid }}" -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO

      - name: Launch, seed demo data, screenshot
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          mkdir -p build/ios/screenshots
          xcrun simctl install "$UDID" build/ios/Build/Products/Debug-iphonesimulator/Ehligible.app
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 20
          xcrun simctl io "$UDID" screenshot build/ios/screenshots/1-onboarding.png
          # The fictional demo person from the Play screenshots, then the home screen.
          python3 tools/screenshots/demo_seed.py build/ios/demo.json
          xcrun simctl terminate "$UDID" "$BUNDLE_ID"
          data=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          mkdir -p "$data/Library/Application Support"
          cp build/ios/demo.json "$data/Library/Application Support/ehligible.json"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 15
          xcrun simctl io "$UDID" screenshot build/ios/screenshots/2-home.png
          # Still running after both launches: no crash on start.
          xcrun simctl spawn "$UDID" launchctl list | grep "$BUNDLE_ID"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-screenshots
          path: build/ios/screenshots/
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-reports
          path: |
            **/build/reports/
            **/build/test-results/
            ~/Library/Logs/DiagnosticReports/
          retention-days: 7
