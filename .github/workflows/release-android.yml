name: Android release

# Push a tag like v1.0.0 (or run manually) to build a signed bundle and upload it to Google Play.
# Required secrets: UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_PASSWORD.
# Optional secret PLAY_SERVICE_ACCOUNT_JSON enables the upload; without it the bundle is only kept as an artifact.
# Repository variable BACKGROUND_LOCATION=true builds the v1.1+ variant with background location (docs/SPEC.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        default: alpha
        options: [internal, alpha, beta, production]

permissions:
  contents: read

jobs:
  release:
    name: Build and upload
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore the upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Test and build the signed bundle
        env:
          EHLIGIBLE_KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          EHLIGIBLE_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          EHLIGIBLE_KEY_ALIAS: upload
          EHLIGIBLE_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          BACKGROUND_LOCATION: ${{ vars.BACKGROUND_LOCATION || 'false' }}
        run: >
          ./gradlew --console=plain check :androidApp:bundleRelease
          -Pehligible.versionCode=$((1000 + GITHUB_RUN_NUMBER))
          -Pehligible.backgroundLocation=$BACKGROUND_LOCATION

      - name: Keep the bundle
        uses: actions/upload-artifact@v7
        with:
          name: ehligible-release
          path: |
            androidApp/build/outputs/bundle/release/*.aab
            androidApp/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Check for Play credentials
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "enabled=$([ -n "$PLAY_JSON" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ca.ehligible
          releaseFiles: androidApp/build/outputs/bundle/release/*.aab
          mappingFile: androidApp/build/outputs/mapping/release/mapping.txt
          track: ${{ inputs.track || 'alpha' }}
          status: completed
          whatsNewDirectory: distribution/whatsnew
